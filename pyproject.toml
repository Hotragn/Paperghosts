[project]
name = "paperghosts"
version = "0.1.0"
description = "Ghost reports printed in US newspapers, 1774-1963, read from the AmericanStories archive."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "pymongo>=4.19.0",
    "sentry-sdk>=2.73.0",
    "temporalio>=1.35.0",
    "tinker>=0.36.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
