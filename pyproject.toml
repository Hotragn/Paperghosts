[project]
name = "paperghosts"
version = "0.1.0"
description = "Ghost reports printed in US newspapers, 1774-1963, read from the AmericanStories archive."
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
